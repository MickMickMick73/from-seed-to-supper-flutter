# From Seed to Supper — iOS via Codemagic (no FlutterFlow)
# Env group "global": CERTIFICATE_PRIVATE_KEY, APP_STORE_CONNECT_PRIVATE_KEY,
# APP_STORE_CONNECT_KEY_IDENTIFIER, APP_STORE_CONNECT_ISSUER_ID

workflows:
  fsts-ios:
    name: Seed to Supper iOS
    instance_type: mac_mini_m2
    max_build_duration: 120
    # Flutter project is this repo root
    environment:
      groups:
        - global
      vars:
        BUNDLE_ID: store.mixapps.seedtosupper
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get packages
        script: |
          set -e
          flutter pub get
          flutter precache --ios
      - name: Verify bundle ID
        script: |
          set -e
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID}" ios/Runner.xcodeproj/project.pbxproj
      - name: Install pods
        script: |
          set -e
          # Flutter 3.24+ may use SPM without Podfile; only run CocoaPods when present
          if [ ! -f ios/Podfile ]; then
            echo "No ios/Podfile — skipping pod install (Swift Package Manager path)"
            exit 0
          fi
          cd ios
          # Generated.xcconfig is gitignored; flutter pub get already created it above
          test -f Flutter/Generated.xcconfig
          pod install --repo-update
      - name: Check App Store Connect env
        script: |
          set -e
          missing=0
          for v in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!v}" ]; then
              echo "Missing env: $v (attach group 'global' on this app)"
              missing=1
            else
              echo "OK $v is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
      - name: Set up keychain
        script: keychain initialize
      - name: Fetch signing files
        script: |
          set -e
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --platform IOS \
            --create
      - name: Add certificates
        script: keychain add-certificates
      - name: Use profiles
        script: |
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist $HOME/export_options.plist
      - name: Build IPA
        script: |
          set -e
          flutter build ipa --release \
            --export-options-plist=$HOME/export_options.plist \
            --build-name=1.0.0 \
            --build-number=${BUILD_NUMBER:-${PROJECT_BUILD_NUMBER:-$(date +%Y%m%d%H%M)}}
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true

  fsts-android:
    name: Seed to Supper Android
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
